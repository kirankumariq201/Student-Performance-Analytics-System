name: EWB Student CRUD Tests

on:
  push:
    paths:
      - "ewb-student-crud/**"
  pull_request:
    paths:
      - "ewb-student-crud/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ewb-student-crud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ewb-student-crud/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
